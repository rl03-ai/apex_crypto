services:
  - type: web
    name: apex-crypto-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    plan: free
    healthCheckPath: /health
    envVars:
      # Cola aqui a connection string do Neon (modo Pooled, sem &channel_binding=require)
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: ALERT_CHECK_INTERVAL_MINUTES
        value: "10"
      - key: PORTFOLIO_UPDATE_INTERVAL_MINUTES
        value: "15"
      # Domínio do frontend — o Render gera automaticamente <name>.onrender.com
      - key: ALLOWED_ORIGINS
        value: "https://apex-crypto-terminal.onrender.com"

  - type: web
    name: apex-crypto-terminal
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    plan: free
    # O frontend é compilado com a URL pública do backend.
    # Se mudares o nome do serviço backend, actualiza este URL.
    dockerBuildArgs:
      - key: VITE_API_BASE_URL
        value: "https://apex-crypto-api.onrender.com"
