services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apex_crypto
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex_crypto"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://apex:apex@db:5432/apex_crypto
      SECRET_KEY: local-dev-secret-change-in-production
      DEBUG: "true"
      SCHEDULER_ENABLED: "true"
      ALERT_CHECK_INTERVAL_MINUTES: "10"
      PORTFOLIO_UPDATE_INTERVAL_MINUTES: "15"
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8080"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:10000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    environment:
      BACKEND_UPSTREAM: http://backend:10000
    depends_on:
      - backend
    ports:
      - "8080:10000"

volumes:
  postgres_data:
